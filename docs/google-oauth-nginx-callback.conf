# Add this exact location inside this deployment's existing TLS server.
# Keep its other locations unchanged. This matches its trusted loopback gateway.
location = /api/backend/integrations/google/callback {
    access_log off;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header Origin http://127.0.0.1:3001;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host 127.0.0.1:3001;
    proxy_set_header Sec-Fetch-Site cross-site;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
